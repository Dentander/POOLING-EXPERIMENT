[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pooling-experiment"
version = "0.1.0"
description = "CIFAR-10 experiments comparing pooling operators"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mlflow",
    "numpy",
    "torch",
    "torchvision",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
